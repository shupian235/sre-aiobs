services:
  app:
    environment:
      GRAFANA_URL: ${GRAFANA_URL:-http://127.0.0.1:3001}
  grafana:
    image: grafana/grafana:11.6.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/grafana/provisioning/datasources/victoriametrics.yaml:/etc/grafana/provisioning/datasources/victoriametrics.yaml:ro
      - ./deploy/grafana/provisioning/dashboards/sre-aiobs.yaml:/etc/grafana/provisioning/dashboards/sre-aiobs.yaml:ro
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/sre-aiobs.json:ro
    depends_on:
      victoriametrics:
        condition: service_started
volumes:
  grafanadata:
