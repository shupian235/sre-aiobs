listen: ":8080"
sources:
  - name: nginx-prod
    kind: elasticsearch
    environment: production
    url: https://elasticsearch.example.net:9200
    credential_env: ELASTICSEARCH_API_KEY
    index: nginx-access-*
    hosts: [www.example.net]
    allowed_methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
    routes:
      - label: /admin
        pattern: '^/admin(?:/|$)'
    fields:
      timestamp: "@timestamp"
      ip: client.ip
      uri: url.original.keyword
      host: url.domain.keyword
      ua: user_agent.original.keyword
      status: http.response.status_code
      latency: nginx.request_time
      # 按实际索引映射启用可选维度。
      # country: client_geo.country_iso_code
      # region: client_geo.region_iso_code
      # method: http.request.method.keyword
      # waf: waf.action.keyword
      # wafrule: waf.category.keyword
      # tls: tls.version.keyword
      # upstream: nginx.upstream_status.keyword
  - name: nginx-staging
    kind: loki
    environment: staging
    url: https://loki.example.net
    credential_env: LOKI_TOKEN
    tenant: staging
    selector: '{app="nginx"}'
    fields: {ip: client_ip, uri: request_uri, host: host, ua: user_agent, status: status, latency: request_time}
  # 取消注释并替换内网地址后，可在「数据源」执行只读检查。
  # - {name: prom-prod, kind: prometheus, environment: production, url: "https://prometheus.example.net", check_timeout: 4s, check_retries: 1}
  # - {name: vm-prod, kind: victoriametrics, environment: production, url: "https://victoriametrics.example.net/select/0/prometheus"}
  # - {name: kube-prod, kind: kubernetes, environment: production, url: "https://kubernetes.example.net", credential_env: KUBERNETES_CHECK_TOKEN}
  # - {name: aws-prod, kind: cloudwatch, environment: production, region: ap-southeast-1}

rules:
  backend_warnings: 0 # 大于 0 时启用 WARN 激增检测
  business_errors: 0 # 大于 0 时启用，且需在来源中映射 fields.businesscode
  ip: 1000
  uri: 2000
  errors: 100
  nginx_burst: 20
  backend_errors: 20
  dependency_errors: 5
  latency: 1
  baseline_multiplier: 3
  sensitive: ['(?i)^/(admin|\.git|\.env)(/|$)']
  user_agents: ['(?i)sqlmap|nikto|masscan']
ai:
  provider: ""
  model: ""
  daily_requests: 100
  timeout: 15s
