listen: ":8080"
sources:
  - name: nginx-prod
    kind: elasticsearch
    environment: production
    url: https://elasticsearch.example.net:9200
    credential_env: ELASTICSEARCH_API_KEY
    index: nginx-access-*
    hosts: [www.example.net]
    allowed_methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
    routes:
      - label: /admin
        pattern: '^/admin(?:/|$)'
    fields:
      timestamp: "@timestamp"
      ip: client.ip
      uri: url.original.keyword
      host: url.domain.keyword
      ua: user_agent.original.keyword
      status: http.response.status_code
      latency: nginx.request_time
      # 按实际索引映射启用可选维度。
      # country: client_geo.country_iso_code
      # region: client_geo.region_iso_code
      # method: http.request.method.keyword
      # waf: waf_action
      # wafrule: waf_category
      # tls: tls.version.keyword
      # upstream: nginx.upstream_status.keyword

  - name: app-prod
    kind: elasticsearch
    environment: production
    url: https://elasticsearch.example.net:9200
    credential_env: ELASTICSEARCH_API_KEY
    index: app-logs-*
    fields: {timestamp: "@timestamp", level: level, exception: exception_type, dependency: dependency_failure, businesscode: business_error_code}

  # 启用后读取 WAF 采集链路写入的安全日志。
  # - name: nginx-security-prod
  #   kind: elasticsearch
  #   environment: production
  #   url: https://elasticsearch.example.net:9200
  #   credential_env: ELASTICSEARCH_API_KEY
  #   index: nginx-security-*
  #   fields:
  #     timestamp: "@timestamp"
  #     ip: client_ip
  #     country: client_geo.country_iso_code
  #     region: client_geo.region_iso_code
  #     waf: waf_action
  #     wafrule: waf_category

rules:
  backend_warnings: 0 # 大于 0 时启用 WARN 激增检测
  business_errors: 0 # 大于 0 时启用，且需在来源中映射 fields.businesscode
  ip: 1000
  uri: 2000
  errors: 100
  nginx_burst: 20
  backend_errors: 20
  dependency_errors: 5
  latency: 1
  baseline_multiplier: 3
  sensitive: ['(?i)^/(admin|\.git|\.env)(/|$)']
  user_agents: ['(?i)sqlmap|nikto|masscan']
ai:
  provider: ""
  model: ""
  daily_requests: 100
  timeout: 15s
# geo_db: /etc/sre-aiobs/geo/GeoLite2-City.mmdb
