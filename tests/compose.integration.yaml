services:
  elastic:
    image: docker.elastic.co/elasticsearch/elasticsearch-oss:7.10.2
    environment:
      discovery.type: single-node
      node.store.allow_mmap: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["127.0.0.1:${TEST_ES_PORT:-19200}:9200"]
  app:
    environment:
      NO_PROXY: "elastic,postgres,redis,localhost,127.0.0.1"
      no_proxy: "elastic,postgres,redis,localhost,127.0.0.1"
    image: ${COMPOSE_PROJECT_NAME:-sre-aiobs-it}-app:local
    depends_on:
      elastic: {condition: service_started}
  migrate:
    image: ${COMPOSE_PROJECT_NAME:-sre-aiobs-it}-app:local
  postgres:
    volumes: !reset []
    tmpfs: [/var/lib/postgresql/data]
  redis:
    volumes: !reset []
    tmpfs: [/data]
