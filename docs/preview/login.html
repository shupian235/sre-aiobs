<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 整合 AIOps 平台</title>
<style>
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: #f3f6fb;
  color: #172743;
  font: 16px system-ui, sans-serif;
}
main {
  width: min(24rem, calc(100% - 4rem));
  padding: 1.5rem;
  border: 1px solid #c9d7eb;
  border-radius: 12px;
  background: #fff;
}
h1 { margin-top: 0; }
form, label { display: grid; gap: .5rem; }
form { gap: 1rem; }
input, button {
  box-sizing: border-box;
  padding: .65rem;
  border: 1px solid #8ca2c0;
  border-radius: 6px;
  font: inherit;
}
button { color: #fff; background: #2458ce; cursor: pointer; }
p { margin: 0; color: #9b1c26; }
p:empty { display: none; }

</style>
</head>
<body>
<main>
  <h1>登录整合 AIOps 平台</h1>
  <section aria-label="登录表单预览" inert>
  <form>
    <label>账号 <input name="username" value="operator" autocomplete="username" required></label>
    <label>密码 <input type="password" name="password" autocomplete="current-password" required></label>
    <label>Google Authenticator 动态码 <input name="code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
    <button type="submit">登录</button>
  </form>
  </section>
  <div style="margin-top: 1rem">离线预览 · 登录控件仅供查看</div>
  <a href="index.html">打开运维看板演示</a>
</main>
</body>
</html>
