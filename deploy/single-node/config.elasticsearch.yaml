listen: ":8080"
sources:
  - name: nginx-local
    kind: elasticsearch
    environment: internal
    url: http://elasticsearch:9200
    index: nginx-access-*
    username: sre_aiobs_reader
    credential_env: ELASTICSEARCH_READER_PASSWORD
    fields:
      timestamp: "@timestamp"
      ip: client_ip
      country: client_geo.country_iso_code
      region: client_geo.region_iso_code
      uri: request_uri
      host: nginx_host
      ua: user_agent
      status: status
      latency: request_time
      method: method
      tls: tls_protocol
      upstream: upstream_status
  - name: application-local
    kind: elasticsearch
    environment: internal
    url: http://elasticsearch:9200
    index: app-logs-*
    username: sre_aiobs_reader
    credential_env: ELASTICSEARCH_READER_PASSWORD
    fields:
      timestamp: "@timestamp"
      level: level
      exception: exception_type
      dependency: dependency_failure
      businesscode: business_error_code
  - name: vulnerabilities-local
    kind: elasticsearch
    environment: internal
    url: http://elasticsearch:9200
    index: vulnerability-findings-*
    username: sre_aiobs_reader
    credential_env: ELASTICSEARCH_READER_PASSWORD
    fields:
      timestamp: "@timestamp"
      vulnerability: vulnerability_id

  - name: nginx-security-local
    kind: elasticsearch
    environment: internal
    url: http://elasticsearch:9200
    index: nginx-security-*
    username: sre_aiobs_reader
    credential_env: ELASTICSEARCH_READER_PASSWORD
    fields:
      timestamp: "@timestamp"
      ip: client_ip
      country: client_geo.country_iso_code
      region: client_geo.region_iso_code
      waf: waf_action
      wafrule: waf_category
