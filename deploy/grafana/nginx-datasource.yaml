apiVersion: 1
datasources:
  - name: Nginx Elasticsearch
    uid: nginx-elasticsearch
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    basicAuth: true
    basicAuthUser: sre_aiobs_reader
    secureJsonData:
      basicAuthPassword: $ELASTICSEARCH_READER_PASSWORD
    jsonData:
      index: nginx-access-*
      timeField: '@timestamp'
      logMessageField: request_uri
      esVersion: '8.17.0'
    editable: false
