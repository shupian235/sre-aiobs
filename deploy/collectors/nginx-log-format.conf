# Include this file in Nginx's http context only if you need to add JSON log collection.
# In the desired server block, add: access_log /var/log/nginx/sre-aiobs.jsonl sre_aiobs_json;
map $server_name $sre_aiobs_service {
    default $server_name;
}

log_format sre_aiobs_json escape=json
    '{"nginx_time":"$time_iso8601","client_ip":"$remote_addr",'
    '"request_uri":"$request_uri","request_path":"$uri","nginx_host":"$host",'
    '"user_agent":"$http_user_agent","status":"$status","request_time":"$request_time",'
    '"method":"$request_method","tls_protocol":"$ssl_protocol","upstream_status":"$upstream_status",'
    '"body_bytes_sent":"$body_bytes_sent","service":"$sre_aiobs_service","log_hostname":"$hostname"}';
